# Site settings
title: xPOPE Projects
description: >-
  Projects, builds, and write-ups by xPOPE: documenting what I'm working on in cybersecurity and tech.
lang: en-US
timezone: America/Los_Angeles
image: assets/img/ogp.png
repo: https://github.com/xPop3/xpop3.github.io
mode: dark

# Profile settings
author:
  name: Benham Haynes (xPOPE)
  bio: >-
    Cybersecurity enthusiast building and documenting projects. This is a work in progress untill I can get a lot of backlog uploaded.
  username: xPop3
  github: xPop3
  twitter:
  facebook:
  email:
  avatar: /assets/img/avatar.jpg

# URL settings
url: "https://xpope.cloud"
baseurl: ""
permalink: /:title/
google_analytics:
fb_appid:

# Collection setting
collections:
  posts:
    output: true

# Markdown settings
markdown: kramdown
highlighter: rouge
kramdown:
  syntax_highlighter: rouge

# Default front matter
defaults:
  - scope:
      path: ""
    values:
      layout: post
      comments: false

# Jekyll Compose default front matter
jekyll_compose:
  post_default_front_matter:
    modified:
    tags: []
    description:
  draft_default_front_matter:
    modified:
    tags: []
    description:

# Homepage limit posts
number_of_posts: 5

# Build settings
sass:
  style: compressed

include:
  - _redirects
  - .htaccess

exclude:
  - CNAME
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - CHANGELOG.md
  - README.md
  - node_modules
  - CODE_OF_CONDUCT.md
  - CONTRIBUTING.md
  - lighthouse.png
  - klise-*.gem
  - klise.gemspec

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-postfiles
